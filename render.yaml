services:
  - type: web
    name: jadvalibot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      - key: PORT
        value: 3000
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_SEND_TIME
        value: "06:00"
      - key: DB_PATH
        value: "./data/bot.sqlite"
