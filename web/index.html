<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'],DS=['Du','Se','Ch','Pa','Ju','Sh'];
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const TIMES=['08:00','08:50','09:40','10:40','11:30','12:20','13:10'],PC=[4,5,5,5,6,6,7,7,7,7,7];
const TEACH=[['Karimova D.','Matematika'],['Yusupov A.','Adabiyot'],['Rahimova S.','Biologiya'],['Tursunov B.','Ingliz tili'],['Qodirov O.','Jismoniy tarbiya'],['Nazarova M.','Tarix'],['Aliyev R.','Fizika'],['Saidova N.','Kimyo'],['Ergashev T.','Informatika'],['Hasanova L.','Ona tili'],['Mirzayev J.','Geografiya'],['Ismoilova G.','Rus tili']];
const TEACH_NAMES=[
  'Karimova D.','Yusupov A.','Rahimova S.','Tursunov B.','Qodirov O.','Nazarova M.','Aliyev R.','Saidova N.',
  'Ergashev T.','Hasanova L.','Mirzayev J.','Ismoilova G.','Boboyev F.','Xoliqova N.','Omonov K.','Abdullayev M.',
  'Toshmatov Sh.','Sultonova D.','Jalilov E.','Po‘latov I.','Xudoyberdiyev U.','Rustamova Z.','Madaminov A.','Berdiyeva G.',
  'Yoqubov S.','Sobirova M.','Xasanov B.','Sharipov F.','Mamatqulov N.','Eshmatova D.','Axmedov J.','Normatov R.',
  'Qosimova O.','Davlatov T.','G‘aniyeva S.','Zokirov A.','Komilova M.','Nematov K.','Vohidova L.','Fayziyev R.'
];
const ALL_PARALLEL_CLS=[
  '1-A','1-B','1-D','1-G',
  '2-A','2-B','2-D','2-G',
  '3-A','3-B','3-D',
  '4-A','4-B','4-D','4-G',
  '5-A','5-B','5-D','5-G',
  '6-A','6-B',
  '7-A','7-B','7-D',
  '8-A','8-B','8-D',
  '9-A','9-B','9-D','9-G','9-F','9-V',
  '10-A','10-B','10-D',
  '11-A','11-B','11-D','11-G'
];
const DEF_CLS=ALL_PARALLEL_CLS.slice();
const hue=s=>[...String(s||'')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),wdOf=i=>new Date(i+'T00:00').getDay();
const addDays=(i,n)=>{const d=new Date(i+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=i=>+i.slice(8)+'-'+MON[+i.slice(5,7)-1];
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3,5);

function genG(numClasses=40){
  const g=[];
  const pool=[];
  for(let i=0;i<Math.max(numClasses,TEACH_NAMES.length);i++){
    const name=TEACH_NAMES[i]||('O‘qituvchi '+(i+1));
    const subj=TEACH[i%TEACH.length][1];
    pool.push([name,subj]);
  }
  for(let d=0;d<6;d++){
    g[d]=[];
    for(let c=0;c<numClasses;c++){
      g[d][c]=[];
      const maxP=PC[c%PC.length]||5;
      for(let p=0;p<7;p++){
        if(p>=maxP){g[d][c][p]=null;continue;}
        const tIndex=(c+p*7+d*11)%pool.length;
        const t=pool[tIndex];
        const room=String(101+c);
        g[d][c][p]=[t[1],t[0],room];
      }
    }
  }
  return g;
}

function resolveClashes(s){
  let count=0;
  const pool=[...new Set([...(s.teachers||[]),...TEACH_NAMES])];
  for(let d=0;d<6;d++){
    for(let p=0;p<7;p++){
      const usedT=new Set();
      const usedR=new Set();
      for(let c=0;c<s.classes.length;c++){
        const x=s.g[d]&&s.g[d][c]?s.g[d][c][p]:null;
        if(!x)continue;
        let [subj,teacher,room]=x;
        let changed=false;
        if(usedT.has(teacher)){
          const avail=pool.find(t=>!usedT.has(t));
          if(avail){
            teacher=avail;
          }else{
            teacher=teacher+' (2)';
            pool.push(teacher);
          }
          changed=true;
        }
        usedT.add(teacher);
        if(room&&usedR.has(room)){
          let nextRoom=String(101+c);
          while(usedR.has(nextRoom)){
            nextRoom=String(Number(nextRoom)+1);
          }
          room=nextRoom;
          changed=true;
        }
        if(room)usedR.add(room);
        if(changed){
          s.g[d][c][p]=[subj,teacher,room];
          if(!s.teachers.includes(teacher))s.teachers.push(teacher);
          count++;
        }
      }
    }
  }
  return count;
}

function downloadTemplate(type='xlsx'){
  const headers=['Kun','Sinf','Soat','Fan','Ustoz','Xona'];
  const sampleData=[
    headers,
    ['Du','1-A',1,'Ona tili','Hasanova L.','101'],
    ['Du','1-A',2,'Matematika','Karimova D.','101'],
    ['Du','1-A',3,'Alifbe','Hasanova L.','101'],
    ['Du','1-B',1,'Ingliz tili','Tursunov B.','102'],
    ['Du','1-B',2,'Ona tili','Hasanova L.','102'],
    ['Du','1-D',1,'Matematika','Karimova D.','103'],
    ['Du','1-G',1,'Tasviriy san\'at','Boboyev F.','104'],
    ['Du','5-A',1,'Jismoniy tarbiya','Qodirov O.','Sportzal'],
    ['Du','5-A',2,'Tarix','Nazarova M.','201'],
    ['Du','11-A',1,'Algebra','Karimova D.','301'],
    ['Du','11-A',2,'Fizika','Aliyev R.','301'],
    ['Du','11-B',1,'Kimyo','Saidova N.','302'],
    ['Du','11-D',1,'Ingliz tili','Tursunov B.','305'],
    ['Du','11-D',2,'Algebra','Karimova D.','305'],
    ['Du','11-D',3,'Fizika','Aliyev R.','305'],
    ['Du','11-G',1,'Adabiyot','Yusupov A.','306'],
    ['Se','11-D',1,'Kimyo','Saidova N.','305'],
    ['Se','11-D',2,'Biologiya','Rahimova S.','305'],
    ['Ch','11-D',1,'Ona tili','Hasanova L.','305'],
    ['Pa','11-D',1,'Informatika','Ergashev T.','305'],
    ['Ju','11-D',1,'Jismoniy tarbiya','Qodirov O.','Sportzal'],
    ['Sh','11-D',1,'Tarix','Nazarova M.','305']
  ];
  if(type==='csv'||typeof XLSX==='undefined'){
    const csvContent='data:text/csv;charset=utf-8,\uFEFF'+sampleData.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const encodedUri=encodeURI(csvContent);
    const link=document.createElement('a');
    link.setAttribute('href',encodedUri);
    link.setAttribute('download','dars_jadvali_shablon.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    return;
  }
  const ws=XLSX.utils.aoa_to_sheet(sampleData);
  ws['!cols']=[{wch:8},{wch:12},{wch:8},{wch:20},{wch:22},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Dars_Jadvali');
  XLSX.writeFile(wb,'dars_jadvali_shablon.xlsx');
}

function mk(code,name,zav,email,pass,empty=false,customClasses=null){
  const t=today();
  const cls=(customClasses&&Array.isArray(customClasses)&&customClasses.length)?customClasses.slice():DEF_CLS.slice();
  const num=cls.length;
  return{
    code,name,zav,email,pass,
    classes:cls,
    g:empty?Array.from({length:6},()=>Array.from({length:num},()=>Array(7).fill(null))):genG(num),
    subs:[],notes:[],log:[],teachers:TEACH_NAMES.slice(),
    hol:[{n:'Kuzgi ta’til',a:'2026-11-04',b:'2026-11-10'},{n:'Qishki ta’til',a:'2026-12-28',b:'2027-01-10'},{n:'Bahorgi ta’til',a:'2027-03-21',b:'2027-03-27'},{n:'Yozgi ta’til',a:'2027-05-25',b:'2027-09-01'}],
    off:[],ex:[{d:addDays(t,3),c:0,s:'Matematika',k:'Nazorat ishi'},{d:addDays(t,6),c:1,s:'Fizika',k:'Imtihon'},{d:addDays(t,5),c:4,s:'Ona tili',k:'Diktant'}]
  };
}

function ensureClasses(s){
  if(!s.classes||!Array.isArray(s.classes)||!s.classes.length){
    s.classes=DEF_CLS.slice();
  }
  if(!s.g||!Array.isArray(s.g))s.g=Array.from({length:6},()=>[]);
  for(let d=0;d<6;d++){
    if(!s.g[d])s.g[d]=[];
    while(s.g[d].length<s.classes.length)s.g[d].push(Array(7).fill(null));
  }
  return s;
}

const K='jadval_v2';let S;try{S=JSON.parse(localStorage.getItem(K))||JSON.parse(localStorage.getItem('jadval_v1'))}catch(e){}
if(!S||!S.schools)S={pass:'admin',schools:[
  mk('M-01','32-maktab','Qosimov R.','test@darsjadvali.uz','darsjadvoli0751',false,ALL_PARALLEL_CLS.slice()),
  mk('M-02','1-maktab','Aliyeva N.','1-maktab@darsjadvali.uz','darsjadvoli0751',false,ALL_PARALLEL_CLS.slice()),
  mk('M-45','45-maktab','Hamidova Z.','hamidova@m45.uz','4545')
]};
// M-01 va M-02 maktablari uchun 40 ta to‘liq parallel sinflarni ta'minlaymiz
const m01=S.schools.find(x=>x.code==='M-01');
if(m01&&m01.classes.length<20){
  m01.classes=ALL_PARALLEL_CLS.slice();
  m01.g=genG(ALL_PARALLEL_CLS.length);
}
const m02=S.schools.find(x=>x.code==='M-02');
if(m02&&m02.classes.length<20){
  m02.classes=ALL_PARALLEL_CLS.slice();
  m02.g=genG(ALL_PARALLEL_CLS.length);
}
S.schools.forEach(s=>{
  ensureClasses(s);
  if(allClash(s)>0)resolveClashes(s);
});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const V={in:false,sid:S.schools[0].code,tab:'matrix',day:Math.max(0,wdOf(today())-1),demo:'',modal:null,clsEdit:null,clsAddModal:false,err:'',pre:''};
const sch=()=>S.schools.find(x=>x.code===V.sid)||S.schools[0];
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)};
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');
const clsOpts=sel=>opts(sch().classes.map((c,i)=>[i,c+(/sinf$/i.test(c)?'':' sinf')]),sel);

function holiday(s,d){const h=s.hol.find(h=>d>=h.a&&d<=h.b);return h?h.n:(s.off.includes(d)?'Kutilmagan ta’til (sovuq kun)':null)}
function resume(s,d){let x=addDays(d,1);for(let i=0;i<500;i++){if(wdOf(x)!==0&&!holiday(s,x))return x;x=addDays(x,1)}return x}

function clashes(s,d){
  const out=[],bad=new Set();
  const numC=s.classes.length;
  for(let p=0;p<7;p++){
    const tm={},rm={};
    for(let c=0;c<numC;c++){
      const x=s.g[d]&&s.g[d][c]?s.g[d][c][p]:null;
      if(!x)continue;
      (tm[x[1]]=tm[x[1]]||[]).push(c);
      if(x[2])(rm[x[2]]=rm[x[2]]||[]).push(c);
    }
    for(const[k,v]of Object.entries(tm)){
      if(v.length>1){
        const clsNames=v.map(i=>(s.classes[i]?s.classes[i].replace(/\s*sinf$/i,''):(i+1))+'-sinf');
        out.push(`${k}: ${p+1}-soat, ${clsNames.join(' va ')}larda bir vaqtda`);
        v.forEach(c=>bad.add(c+'-'+p));
      }
    }
    for(const[k,v]of Object.entries(rm)){
      if(v.length>1){
        const clsNames=v.map(i=>(s.classes[i]?s.classes[i].replace(/\s*sinf$/i,''):(i+1))+'-sinf');
        out.push(`${k}-xona: ${p+1}-soat, ${clsNames.join(' va ')}larga tushgan`);
        v.forEach(c=>bad.add(c+'-'+p));
      }
    }
  }
  return{out,bad};
}
const allClash=s=>[0,1,2,3,4,5].reduce((a,d)=>a+clashes(s,d).out.length,0);

presetstd(){
  const s=sch();

  s.classes=Array.from({length:11},(_,i)=>(i+1)+'-sinf');

const C={
file(v,el){const f=el.files[0];if(!f)return;if(typeof XLSX==='undefined')return toast('Excel kutubxonasi yuklanmadi');const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}))}catch(x){toast('Faylni o‘qib bo‘lmadi')}};r.readAsArrayBuffer(f)}};

function importRows(rows){
  const s=sch();let n=0;
  for(const r of rows){
    if(!r||r.length<6)continue;
    const k=String(r[0]).trim().toLowerCase();
    let d=/^\d$/.test(k)?+k-1:DS.findIndex(x=>x.toLowerCase()===k.slice(0,2));
    const rawClass=String(r[1]).trim();
    let c=s.classes.findIndex(x=>x.toLowerCase()===rawClass.toLowerCase()||x.toLowerCase().replace(/\s*sinf/,'')===rawClass.toLowerCase().replace(/\s*sinf/,''));
    if(c===-1){
      const num=parseInt(rawClass);
      if(!isNaN(num)&&num>=1&&num<=s.classes.length){
        c=num-1;
      }else if(rawClass){
        s.classes.push(rawClass);
        c=s.classes.length-1;
        for(let day=0;day<6;day++){
          if(!s.g[day])s.g[day]=[];
          s.g[day].push(Array(7).fill(null));
        }
      }
    }
    const p=parseInt(r[2])-1;
    if(d<0||d>5||c<0||!(p>=0&&p<7)||!r[3])continue;
    if(!s.g[d][c])s.g[d][c]=Array(7).fill(null);
    s.g[d][c][p]=[String(r[3]).trim(),String(r[4]||'').trim(),String(r[5]==null?'':r[5]).trim()];
    if(r[4]&&!s.teachers.includes(String(r[4]).trim()))s.teachers.push(String(r[4]).trim());
    n++;
  }
  if(!n)return toast('Mos qator topilmadi. Ustunlar: Kun, Sinf, Soat, Fan, Ustoz, Xona');
  s.subs=[];save();R();toast(`${n} ta dars yuklandi, to‘qnashuvlar: ${allClash(s)}`);
}

// Hash support e.g. #M-01
const h0=decodeURIComponent(location.hash.slice(1)).toUpperCase();
if(/^[A-Z0-9-]+$/.test(h0)){
  const sc=S.schools.find(x=>x.code.toUpperCase()===h0);
  if(sc){V.sid=sc.code;V.pre=sc.code}

// Backend schools & classes sync
(async()=>{
  try{
    const res=await fetch('/api/schools');
    const d=await res.json();
    if(d&&d.success&&Array.isArray(d.data)&&d.data.length){
      for(const b of d.data){
        let sc=S.schools.find(x=>x.code===b.code);
        if(!sc){
          sc=mk(b.code,b.name,b.admin_name||'Zavuch',b.admin_email||'',b.admin_password||'darsjadvoli0751',b.lessonsCount===0,b.code==='M-01'?ALL_PARALLEL_CLS.slice():null);
          S.schools.push(sc);
        }else{
          sc.name=b.name;
        }
        try{
          const cRes=await fetch(`/api/classes?schoolCode=${encodeURIComponent(b.code)}`);
          const cData=await cRes.json();
          if(cData&&cData.success&&Array.isArray(cData.data)&&cData.data.length>0){
            const serverClasses=cData.data.map(g=>g.name.replace(/\s*sinf\s*$/i,'').trim()).filter(Boolean);
            if(serverClasses.length>0){
              serverClasses.forEach(cName=>{
                if(!sc.classes.includes(cName))sc.classes.push(cName);
              });
            }
          }
        }catch(ce){}
      }
      S.schools.forEach(ensureClasses);
      save();R();
    }
  }catch(e){}
})();

R();
