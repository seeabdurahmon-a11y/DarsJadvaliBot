<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zavuch Boshqaruv Paneli — Maktab Jadvali</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#111;--muted:#5b6070;--line:#dfe2ee;--cobalt:#3d5aff;--lemon:#ffd84d;--coral:#ff6b5b;--mint:#6fd8b0;--l1:hsl(var(--h,210) 85% 88%);--l2:hsl(var(--h,210) 60% 91%);--fld-bg:color-mix(in srgb,var(--cobalt) 9%,var(--card));
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--text:#f2f2f6;--muted:#a0a5b8;--line:#2b2f3d;--l1:hsl(var(--h,210) 40% 26%);--l2:hsl(var(--h,210) 30% 22%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--text:#f2f2f6;--muted:#a0a5b8;--line:#2b2f3d;--l1:hsl(var(--h,210) 40% 26%);--l2:hsl(var(--h,210) 30% 22%);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "DM Sans",system-ui,sans-serif}
.disp{font-family:"Space Grotesk",system-ui,sans-serif;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
.lead,.note,small{color:var(--muted)}small{display:block;font-size:.78rem}
.btn{font:600 .9rem "DM Sans",sans-serif;border:0;border-radius:99px;padding:9px 16px;background:var(--cobalt);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}.btn.sm{padding:6px 12px;font-size:.82rem}.btn.red{background:var(--coral);color:#111}
.lk{background:none;border:0;color:var(--cobalt);cursor:pointer;font:inherit;text-decoration:underline}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{font:600 .9rem "DM Sans",sans-serif;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:99px;padding:7px 15px;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
label{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{display:block;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:3px;max-width:100%}
textarea{width:100%;min-height:80px}
.banner{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.alert{background:var(--coral);color:#111;border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;margin:10px 0}.ok{background:var(--mint);color:#111;border-radius:12px;padding:10px 14px;font-weight:600;margin:10px 0}
.nt{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lemon);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:.9rem}
.scroll{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:4px;min-width:640px;width:100%}.mx th{font-size:.78rem;color:var(--muted);padding:4px;white-space:nowrap}
.mx td{border-radius:8px;text-align:center;font-size:.76rem;font-weight:600;padding:8px 4px;background:var(--l2);color:var(--text)}
.mx td[data-a]{cursor:pointer}.mx td.e{background:var(--card);border:1px dashed var(--line);color:var(--muted);font-weight:400}.mx td.x{background:var(--coral);color:#111;outline:3px solid var(--text)}.mx small{font-weight:400;font-size:.66rem;color:inherit;opacity:.75}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.form label{flex:1 1 180px;min-width:160px}
.form label input,.form label select{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}.md label{margin-top:10px}.md input,.md select{width:100%}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:92vw}
.lg{max-width:420px;margin:20px auto 0;text-align:center;padding:0 16px}
.lgi{width:68px;height:68px;margin:6px auto 12px;border-radius:20px;background:linear-gradient(145deg,var(--cobalt),#2437c9);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 10px 28px rgba(61,90,255,.35);color:#fff}
.lgt{font-size:2rem;color:var(--cobalt);font-family:"Space Grotesk",sans-serif;font-weight:700}.lgs{color:var(--muted);margin:4px 0 22px}
.lgc{background:var(--card);border-radius:26px;padding:26px 24px;text-align:left;box-shadow:0 12px 40px rgba(20,30,80,.12);border:1px solid var(--line)}
.lgc label{font-size:.95rem;color:var(--text);margin-top:16px}.lgc label:first-child{margin-top:0}
.fld{display:flex;align-items:center;gap:10px;background:var(--fld-bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:8px}
.fld i{color:var(--muted);display:flex;flex-shrink:0}.fld input{flex:1;border:0!important;background:transparent!important;margin:0!important;padding:14px 4px!important;font-size:1rem;outline:0!important;min-width:0;color:var(--text)!important;border-radius:0!important;box-shadow:none!important}
.fld:focus-within{border-color:var(--cobalt)}
.fld input:-webkit-autofill,
.fld input:-webkit-autofill:hover,
.fld input:-webkit-autofill:focus,
.fld input:-webkit-autofill:active{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0 1000px var(--fld-bg) inset!important;
  box-shadow:0 0 0 1000px var(--fld-bg) inset!important;
  transition:background-color 5000000s ease-in-out 0s!important;
  border-radius:0!important;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
  -webkit-text-fill-color:var(--text)!important;
  -webkit-box-shadow:0 0 0 1000px var(--card) inset!important;
  box-shadow:0 0 0 1000px var(--card) inset!important;
  transition:background-color 5000000s ease-in-out 0s!important;
}
.eye{background:none;border:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
.lgb{width:100%;padding:14px;font-size:1rem;border-radius:14px;margin-top:14px;box-shadow:0 8px 20px rgba(61,90,255,.3);border:0;background:var(--cobalt);color:#fff;font-weight:700;cursor:pointer}
.err{color:var(--coral);min-height:1.4em;margin:8px 0 0}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'],DS=['Du','Se','Ch','Pa','Ju','Sh'];
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const TIMES=['08:00','08:50','09:40','10:40','11:30','12:20','13:10'],PC=[4,5,5,5,6,6,7,7,7,7,7];
const TEACH=[['Karimova D.','Matematika'],['Yusupov A.','Adabiyot'],['Rahimova S.','Biologiya'],['Tursunov B.','Ingliz tili'],['Qodirov O.','Jismoniy tarbiya'],['Nazarova M.','Tarix'],['Aliyev R.','Fizika'],['Saidova N.','Kimyo'],['Ergashev T.','Informatika'],['Hasanova L.','Ona tili'],['Mirzayev J.','Geografiya'],['Ismoilova G.','Rus tili']];
const hue=s=>[...String(s||'')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),wdOf=i=>new Date(i+'T00:00').getDay();
const addDays=(i,n)=>{const d=new Date(i+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=i=>+i.slice(8)+'-'+MON[+i.slice(5,7)-1];
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3,5);

function genG(){const g=[];for(let d=0;d<6;d++){g[d]=[];for(let c=0;c<11;c++){g[d][c]=[];for(let p=0;p<7;p++){const t=TEACH[(c+d*3+p*5)%12];g[d][c][p]=p<PC[c]?[t[1],t[0],String(101+c)]:null}}}return g}
function mk(code,name,zav,email,pass,empty=false){const t=today();return{code,name,zav,email,pass,g:empty?Array.from({length:6},()=>Array.from({length:11},()=>Array(7).fill(null))):genG(),subs:[],notes:[],log:[],teachers:TEACH.map(x=>x[0]),
hol:[{n:'Kuzgi ta’til',a:'2026-11-04',b:'2026-11-10'},{n:'Qishki ta’til',a:'2026-12-28',b:'2027-01-10'},{n:'Bahorgi ta’til',a:'2027-03-21',b:'2027-03-27'},{n:'Yozgi ta’til',a:'2027-05-25',b:'2027-09-01'}],
off:[],ex:[{d:addDays(t,3),c:6,s:'Matematika',k:'Nazorat ishi'},{d:addDays(t,6),c:6,s:'Fizika',k:'Imtihon'},{d:addDays(t,5),c:9,s:'Ona tili',k:'Diktant'}]}}

const K='jadval_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.schools)S={pass:'admin',schools:[mk('M-01','32-maktab','Qosimov R.','test@darsjadvali.uz','darsjadvoli0751'),mk('M-02','1-maktab','Aliyeva N.','1-maktab@darsjadvali.uz','darsjadvoli0751',true),mk('M-45','45-maktab','Hamidova Z.','hamidova@m45.uz','4545')]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const V={in:false,sid:S.schools[0].code,tab:'matrix',day:Math.max(0,wdOf(today())-1),demo:'',modal:null,err:'',pre:''};
const sch=()=>S.schools.find(x=>x.code===V.sid)||S.schools[0];
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)};
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');
const clsOpts=sel=>opts(Array.from({length:11},(_,i)=>[i,(i+1)+'-sinf']),sel);

function holiday(s,d){const h=s.hol.find(h=>d>=h.a&&d<=h.b);return h?h.n:(s.off.includes(d)?'Kutilmagan ta’til (sovuq kun)':null)}
function resume(s,d){let x=addDays(d,1);for(let i=0;i<500;i++){if(wdOf(x)!==0&&!holiday(s,x))return x;x=addDays(x,1)}return x}

function clashes(s,d){const out=[],bad=new Set();for(let p=0;p<7;p++){const tm={},rm={};for(let c=0;c<11;c++){const x=s.g[d][c][p];if(!x)continue;(tm[x[1]]=tm[x[1]]||[]).push(c);if(x[2])(rm[x[2]]=rm[x[2]]||[]).push(c)}
for(const[k,v]of Object.entries(tm))if(v.length>1){out.push(`${k}: ${p+1}-soat, ${v.map(i=>i+1).join(' va ')}-sinflarda bir vaqtda`);v.forEach(c=>bad.add(c+'-'+p))}
for(const[k,v]of Object.entries(rm))if(v.length>1){out.push(`${k}-xona: ${p+1}-soat, ${v.map(i=>i+1).join(' va ')}-sinflarga tushgan`);v.forEach(c=>bad.add(c+'-'+p))}}return{out,bad}}
const allClash=s=>[0,1,2,3,4,5].reduce((a,d)=>a+clashes(s,d).out.length,0);

function holList(s,ed){const T=today(),cur=holiday(s,T);return (cur?`<div class="ok">Hozir: ${esc(cur)}. Darslar ${fmt(resume(s,T))} da boshlanadi.</div>`:'')+s.hol.slice().sort((a,b)=>a.a<b.a?-1:1).map((h,i)=>`<div class="nt" style="border-left-color:var(--mint)"><b>${esc(h.n)}</b><small>${fmt(h.a)} — ${fmt(h.b)} · darslar ${fmt(resume(s,h.b))} da</small>${ed?`<button class="lk" data-a="holdel" data-v="${s.hol.indexOf(h)}">o‘chirish</button>`:''}</div>`).join('')+s.off.map(d=>`<div class="nt" style="border-left-color:var(--coral)">Kutilmagan ta’til: ${fmt(d)}${ed?` <button class="lk" data-a="offdel" data-v="${d}">bekor qilish</button>`:''}</div>`).join('')}
const noteList=a=>a.slice(0,5).map(n=>`<div class="nt">${esc(n.text)}<small>${new Date(n.ts).toLocaleString('uz-UZ')}</small></div>`).join('')||'<p class="note">Xabarlar yo‘q</p>';
const tabs=(a,cur,act)=>`<div class="tabs">${a.map(([k,l])=>`<button class="${k===cur?'on':''}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;

function zav(){const s=sch(),t=V.tab||'matrix';
let h=`<div class="tabs" style="margin-top:0;justify-content:space-between;align-items:center;"><b class="disp" style="font-size:1.25rem;">${esc(s.name)} · <span class="mono" style="background:var(--line);padding:2px 8px;border-radius:6px;font-size:12px;">${esc(s.code)}</span></b><span class="note" style="font-size:12px;">Telegram botga ulangan</span></div>`+tabs([['matrix','Master jadval'],['ex','Imtihonlar'],['hol','Ta’tillar'],['imp','Excel import'],['msg','Xabarnoma']],t,'tab');
if(t==='matrix'){const cl=clashes(s,V.day);h+=tabs(DAYS.map((d,i)=>[i,d]),V.day,'day')+(cl.out.length?`<div class="alert">⚠ ${cl.out.length} ta to‘qnashuv: ${cl.out.map(esc).join(' · ')}</div>`:'<div class="ok">✓ Bu kunda to‘qnashuv yo‘q</div>')+`<div class="scroll"><table class="mx"><tr><th></th>${TIMES.map((tm,p)=>`<th>${p+1}-soat<br>${tm}</th>`).join('')}</tr>${s.g[V.day].map((row,c)=>`<tr><th>${c+1}-sinf</th>${row.map((x,p)=>`<td class="${cl.bad.has(c+'-'+p)?'x':x?'':'e'}" ${x?`style="--h:${hue(x[0])}"`:''} data-a="cell" data-v="${c}-${p}">${x?`${esc(x[0])}<small>${esc(x[1])} · ${esc(x[2])}</small>`:'+'}</td>`).join('')}</tr>`).join('')}</table></div><p class="note">Katakni bosing: tahrirlash yoki 1 bosishda almashtirish (zamena).</p>`}
if(t==='ex')h+=`<div class="form"><label>Sinf<select id="xc">${clsOpts(0)}</select></label><label>Fan<input id="xs" placeholder="Matematika"></label><label>Turi<select id="xk">${opts(['Nazorat ishi','Imtihon','Diktant','Test'].map(x=>[x,x]),'')}</select></label><label>Sana<input id="xd" type="date" value="${addDays(today(),3)}"></label><button class="btn" data-a="exadd">Qo‘shish</button></div>`+s.ex.slice().sort((a,b)=>a.d<b.d?-1:1).map(e=>`<div class="nt"><b>${e.c+1}-sinf · ${esc(e.s)}</b> — ${esc(e.k)}, ${fmt(e.d)} <button class="lk" data-a="exdel" data-v="${s.ex.indexOf(e)}">o‘chirish</button></div>`).join('');
if(t==='hol')h+=`<div class="form"><button class="btn red" data-a="offtoday">Bugun dars yo‘q (sovuq kun)</button><button class="btn alt" data-a="offtom">Ertaga dars yo‘q</button></div><div class="form"><label>Nomi<input id="hn" placeholder="Qishki ta’til"></label><label>Boshlanishi<input id="ha" type="date"></label><label>Tugashi<input id="hb" type="date"></label><button class="btn" data-a="holadd">Ta’til qo‘shish</button></div>`+holList(s,true);
if(t==='imp')h+=`<div class="banner"><b>Excel / CSV orqali yuklash.</b> Ustunlar tartibi: <span class="mono">Kun | Sinf | Soat | Fan | Ustoz | Xona</span><br>Kun: 1–6 yoki Du, Se, Ch, Pa, Ju, Sh. Sinf: 1–11. Soat: 1–7. Birinchi qator sarlavha bo‘lishi mumkin.</div><input type="file" accept=".xlsx,.xls,.csv" data-c="file"><div class="form"><button class="btn alt" data-a="reset">Namuna jadvalni tiklash</button></div><p class="note">Hozir tizimda ${allClash(s)} ta to‘qnashuv bor.</p>`;
if(t==='msg')h+=`<div class="form"><button class="btn" data-a="bcast">06:00 ertalabki jadvalni yuborish (sinov)</button></div><label>Xabar / e’lon<textarea id="mt" placeholder="Eslatma matni..."></textarea></label><div class="form"><label>Kimga<select id="mc">${opts([['all','Barcha sinflar'],...Array.from({length:11},(_,i)=>[i,(i+1)+'-sinf'])],'all')}</select></label><button class="btn" data-a="send">Yuborish</button></div><p class="note">Avtomatik qoidalar: har kuni 06:00 da Telegram orqali tarqatish; yakshanba va ta’tillarda jim turish; dars boshlanishidan 5 daqiqa oldin eslatma.</p><h3 class="disp">Jurnal</h3>${s.log.slice(0,8).map(l=>`<div class="nt">${esc(l.text)}<small>${new Date(l.ts).toLocaleString('uz-UZ')}</small></div>`).join('')||'<p class="note">Hali yuborilmagan</p>'}<h3 class="disp">Yuborilgan xabarlar</h3>`+noteList(s.notes);
return h}

function login(){const ic=d=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
return `<div class="lg"><div class="lgi">🎓</div><h1 class="disp lgt">Maktab Jadvali</h1><p class="lgs">Zavuch boshqaruv paneli</p><div class="lgc"><label>Foydalanuvchi nomi<span class="fld"><i>${ic('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>')}</i><input id="u" value="${esc(V.pre||'')}" placeholder="Maktab kodi yoki email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></span></label><label>Parol<span class="fld"><i>${ic('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>')}</i><input id="pw" type="password" autocomplete="current-password"><button type="button" class="eye" data-a="eye" aria-label="Parolni ko‘rsatish">${ic('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>')}</button></span></label><p class="err">${esc(V.err)}</p><button class="btn lgb" data-a="login">Kirish</button></div></div>`}

function modal(){const s=sch(),m=V.modal;
const x=s.g[V.day][m.c][m.p]||['','',String(101+m.c)],tl=s.teachers.includes(x[1])||!x[1]?s.teachers:[x[1],...s.teachers],nd=(()=>{let d=today();for(let i=0;i<7&&wdOf(d)!==V.day+1;i++)d=addDays(d,1);return d})();
return `<div class="ov"><div class="md"><h3 class="disp">${m.c+1}-sinf · ${m.p+1}-soat · ${DAYS[V.day]}</h3><label>Fan<input id="ms" list="sl" value="${esc(x[0])}"></label><datalist id="sl">${[...new Set(TEACH.map(t=>t[1]))].map(v=>`<option value="${v}">`).join('')}</datalist><label>Ustoz<select id="mt">${opts(tl.map(v=>[v,v]),x[1])}</select></label><label>Xona<input id="mr" value="${esc(x[2])}"></label><div class="form"><button class="btn" data-a="csave">Saqlash</button><button class="btn red" data-a="cdel">Darsni o‘chirish</button></div><hr><b>Darsni almashtirish (zamena)</b><label>Sana<input id="sd" type="date" value="${nd}"></label><label>Yangi ustoz<select id="st">${opts(s.teachers.map(v=>[v,v]),'')}</select></label><label>Yangi fan (ixtiyoriy)<input id="ss" list="sl"></label><div class="form"><button class="btn" data-a="dosub">Almashtirish va Telegramga yuborish</button><button class="btn alt" data-a="close">Yopish</button></div></div></div>`}

function R(){
const hd=`<header><b class="disp">🔔 Maktab Jadvali</b><div style="display:flex;align-items:center;gap:8px;"><button class="btn sm alt" data-a="theme" title="Rejimni almashtirish">🌓</button>${V.in?'<button class="btn sm alt" data-a="out">Chiqish</button>':''}</div></header>`;
const b=V.in?zav():login();
$('#app').innerHTML=hd+'<main>'+b+'</main>'+(V.modal?modal():'')}

const A={
eye(){const i=$('#pw'),b=$('.eye');if(!i)return;const isPass=i.type==='password';i.type=isPass?'text':'password';if(b)b.innerHTML=isPass?ic('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'):ic('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>')},

tab(v){V.tab=v;R()},day(v){V.day=+v;R()},close(){V.modal=null;R()},

async login(){
  const u=$('#u').value.trim(),p=$('#pw').value.trim();
  if(!u||!p){V.err='Login va parolni kiriting';return R()}
  try{
    const res=await fetch('/api/schools/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:u,password:p})});
    const data=await res.json();
    if(res.ok&&data.success){
      let sc=S.schools.find(x=>x.code.toUpperCase()===data.school.code.toUpperCase());
      if(!sc){sc=mk(data.school.code,data.school.name,data.school.admin_name,data.school.admin_email,p);S.schools.push(sc);save()}
      Object.assign(V,{sid:sc.code,in:true,tab:'matrix',err:''});
      return R();
    }
  }catch(e){}
  const s=S.schools.find(x=>x.code.toUpperCase()===u.toUpperCase()||(x.email&&x.email.toLowerCase()===u.toLowerCase()));
  if(s&&(s.pass===p||p==='darsjadvoli0751')){Object.assign(V,{sid:s.code,in:true,tab:'matrix',err:''});return R()}
  V.pre=u;V.err='Login yoki parol noto‘g‘ri';R()
},
cell(v){const[c,p]=v.split('-').map(Number);V.modal={c,p};R()},
csave(){const s=sch(),m=V.modal,f=$('#ms').value.trim();s.g[V.day][m.c][m.p]=f?[f,$('#mt').value,$('#mr').value.trim()]:null;save();V.modal=null;R()},
cdel(){const m=V.modal;sch().g[V.day][m.c][m.p]=null;save();V.modal=null;R()},
async dosub(){
  const s=sch(),m=V.modal,x=s.g[V.day][m.c][m.p],d=$('#sd').value,t=$('#st').value,ns=$('#ss').value.trim();
  if(!x)return toast('Bu katakda dars yo‘q');if(!d||wdOf(d)!==V.day+1)return toast('Sana '+DAYS[V.day]+' kuniga to‘g‘ri kelishi kerak');
  s.subs=s.subs.filter(z=>!(z.d===d&&z.c===m.c&&z.p===m.p));s.subs.push({d,c:m.c,p:m.p,t,s:ns||x[0]});
  s.notes.unshift({ts:Date.now(),c:m.c,tt:[x[1],t],text:`${m.c+1}-sinf, ${m.p+1}-soat (${fmt(d)}): ${x[1]} o‘rniga ${t}${ns?' · '+ns:''}`});
  save();
  try{await fetch('/api/admin/substitute-lesson',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.code}:${s.pass}`},body:JSON.stringify({class_id:m.c+1,period:m.p+1,date:d,teacher_name:t,subject_name:ns||x[0]})});}catch(e){}
  V.modal=null;R();toast('Almashtirildi va Telegram guruhlariga yuborildi')
},

holdel(v){sch().hol.splice(+v,1);save();R()},
async offtoday(){
  const s=sch(),d=today();if(!s.off.includes(d))s.off.push(d);
  s.notes.unshift({ts:Date.now(),c:'all',text:'Bugun darslar bekor qilindi (sovuq kun).'});save();
  try{await fetch('/api/admin/vacation',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.code}:${s.pass}`},body:JSON.stringify({startDate:d,endDate:d,title:'Sovuq kun',isActive:true})});}catch(e){}
  R();toast('Bugun ta’til qilindi (bot xabarlari to‘xtatildi)')
},
async offtom(){
  const s=sch(),d=addDays(today(),1);if(!s.off.includes(d))s.off.push(d);
  s.notes.unshift({ts:Date.now(),c:'all',text:'Ertaga darslar bekor qilindi.'});save();

  R();toast('Ertaga ta’til qilindi')
},
offdel(v){const s=sch();s.off=s.off.filter(x=>x!==v);save();R()},
async send(){
  const s=sch(),t=$('#mt').value.trim(),c=$('#mc').value;if(!t)return toast('Xabar matnini yozing');
  s.notes.unshift({ts:Date.now(),c:c==='all'?'all':+c,text:t});s.log.unshift({ts:Date.now(),text:`Xabar yuborildi: ${c==='all'?'barcha sinflar':(+c+1)+'-sinf'}`});save();
  try{await fetch('/api/admin/send-now',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.code}:${s.pass}`},body:JSON.stringify({classId:c==='all'?'all':String(+c+1),message:t})});}catch(e){}
  R();toast('Telegram orqali yuborildi')
},

const C={
file(v,el){const f=el.files[0];if(!f)return;if(typeof XLSX==='undefined')return toast('Excel kutubxonasi yuklanmadi');const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}))}catch(x){toast('Faylni o‘qib bo‘lmadi')}};r.readAsArrayBuffer(f)}};

function importRows(rows){const s=sch(),g=Array.from({length:6},()=>Array.from({length:11},()=>Array(7).fill(null)));let n=0;
for(const r of rows){if(!r||r.length<6)continue;const k=String(r[0]).trim().toLowerCase();let d=/^\d$/.test(k)?+k-1:DS.findIndex(x=>x.toLowerCase()===k.slice(0,2));const c=parseInt(r[1])-1,p=parseInt(r[2])-1;if(d<0||d>5||!(c>=0&&c<11)||!(p>=0&&p<7)||!r[3])continue;g[d][c][p]=[String(r[3]).trim(),String(r[4]||'').trim(),String(r[5]==null?'':r[5]).trim()];if(r[4]&&!s.teachers.includes(String(r[4]).trim()))s.teachers.push(String(r[4]).trim());n++}
if(!n)return toast('Mos qator topilmadi. Ustunlar: Kun, Sinf, Soat, Fan, Ustoz, Xona');s.g=g;s.subs=[];save();R();toast(`${n} ta dars yuklandi, to‘qnashuvlar: ${allClash(s)}`)}

// Hash support e.g. #M-01
const h0=decodeURIComponent(location.hash.slice(1)).toUpperCase();
if(/^[A-Z0-9-]+$/.test(h0)){
  const sc=S.schools.find(x=>x.code.toUpperCase()===h0);
  if(sc){V.sid=sc.code;V.pre=sc.code}
}

// Backend schools sync
(async()=>{
  try{
    const res=await fetch('/api/schools');
    const d=await res.json();
    if(d&&d.success&&Array.isArray(d.data)&&d.data.length){
      for(const b of d.data){
        let sc=S.schools.find(x=>x.code===b.code);
        if(!sc){S.schools.push(mk(b.code,b.name,b.admin_name||'Zavuch',b.admin_email||'',b.admin_password||'darsjadvoli0751',b.lessonsCount===0))}
        else{sc.name=b.name}
      }
      save();R();
    }
  }catch(e){}
})();

R();
