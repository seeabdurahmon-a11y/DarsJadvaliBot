<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maktab dars jadvali platformasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#111;--muted:#5b6070;--line:#dfe2ee;--cobalt:#3d5aff;--lemon:#ffd84d;--coral:#ff6b5b;--mint:#6fd8b0;--l1:hsl(var(--h,210) 85% 88%);--l2:hsl(var(--h,210) 60% 91%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--text:#f2f2f6;--muted:#a0a5b8;--line:#2b2f3d;--l1:hsl(var(--h,210) 40% 26%);--l2:hsl(var(--h,210) 30% 22%)}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--text:#f2f2f6;--muted:#a0a5b8;--line:#2b2f3d;--l1:hsl(var(--h,210) 40% 26%);--l2:hsl(var(--h,210) 30% 22%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "DM Sans",system-ui,sans-serif}
.disp{font-family:"Space Grotesk",system-ui,sans-serif;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
.lead,.note,small{color:var(--muted)}small{display:block;font-size:.78rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}
.rc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s ease, transform .15s ease}
.rc:hover{border-color:var(--cobalt);transform:translateY(-2px)}
.rc b{display:block;font:700 1.15rem "Space Grotesk",sans-serif;margin:6px 0 2px}
.btn{font:600 .9rem "DM Sans",sans-serif;border:0;border-radius:99px;padding:9px 16px;background:var(--cobalt);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}.btn.sm{padding:6px 12px;font-size:.82rem}.btn.red{background:var(--coral);color:#111}
.lk{background:none;border:0;color:var(--cobalt);cursor:pointer;font:inherit;text-decoration:underline}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{font:600 .9rem "DM Sans",sans-serif;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:99px;padding:7px 15px;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sel{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{display:block;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:3px;max-width:100%}
textarea{width:100%;min-height:80px}
.hero{background:var(--cobalt);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:12px}.hero h2{font-size:1.6rem;margin:2px 0;font-family:"Space Grotesk",sans-serif}.hero small{color:#fff;opacity:.85}
.next{background:var(--lemon);color:#111;border-radius:14px;padding:10px 14px;font-weight:600;margin-bottom:10px}.next.ring{background:var(--coral);animation:p 1.2s infinite;color:#111}
@keyframes p{50%{opacity:.75}}
.lesson{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border-radius:16px;padding:12px;margin-top:8px;background:var(--l1);border:1px solid var(--line);border-left:5px solid hsl(var(--h,210) 80% 50%)}
.lesson .n{font:700 1.3rem "Space Grotesk",sans-serif}.lesson b{display:block}.lesson.sub{outline:3px solid var(--coral)}.lesson.gone{opacity:.5;text-decoration:line-through}
.chip{background:rgba(255,255,255,.75);color:#111;border-radius:99px;padding:3px 10px;font-weight:600;font-size:.8rem}
.banner{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.alert{background:var(--coral);color:#111;border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;margin:10px 0}.ok{background:var(--mint);color:#111;border-radius:12px;padding:10px 14px;font-weight:600;margin:10px 0}
.nt{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lemon);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:.9rem}
.scroll{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:4px;min-width:640px;width:100%}.mx th{font-size:.78rem;color:var(--muted);padding:4px;white-space:nowrap}
.mx td{border-radius:8px;text-align:center;font-size:.76rem;font-weight:600;padding:8px 4px;background:var(--l2);color:var(--text)}
.mx td[data-a]{cursor:pointer}.mx td.e{background:var(--card);border:1px dashed var(--line);color:var(--muted);font-weight:400}.mx td.x{background:var(--coral);color:#111;outline:3px solid var(--text)}.mx small{font-weight:400;font-size:.66rem;color:inherit;opacity:.75}
.tb{border-collapse:collapse;width:100%;min-width:600px}.tb th{text-align:left;font-size:.8rem;color:var(--muted);padding:8px}.tb td{padding:8px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.box{max-width:340px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.box label{margin-top:10px}.box input{width:100%}.err{color:var(--coral);min-height:1.4em;margin:8px 0 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}.md label{margin-top:10px}.md input,.md select{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.st b{font:700 1.8rem "Space Grotesk",sans-serif;display:block;color:var(--cobalt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:92vw}
.lg{max-width:420px;margin:10px auto 0;text-align:center}
.lgi{width:68px;height:68px;margin:6px auto 12px;border-radius:20px;background:linear-gradient(145deg,var(--cobalt),#2437c9);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 10px 28px rgba(61,90,255,.35);color:#fff}
.lgt{font-size:2rem;color:var(--cobalt);font-family:"Space Grotesk",sans-serif;font-weight:700}.lgs{color:var(--muted);margin:4px 0 22px}
.lgc{background:var(--card);border-radius:26px;padding:26px 24px;text-align:left;box-shadow:0 12px 40px rgba(20,30,80,.12);border:1px solid var(--line)}
.lgc label{font-size:.95rem;color:var(--text);margin-top:16px}.lgc label:first-child{margin-top:0}
.fld{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--cobalt) 9%,var(--card));border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:8px}
.fld i{color:var(--muted);display:flex}.fld input{flex:1;border:0;background:transparent;margin:0;padding:14px 0;font-size:1rem;outline:0;min-width:0;color:var(--text)}.fld:focus-within{border-color:var(--cobalt)}
.eye{background:none;border:0;color:var(--muted);cursor:pointer;display:flex;padding:4px}
.lgb{width:100%;padding:14px;font-size:1rem;border-radius:14px;margin-top:12px;box-shadow:0 8px 20px rgba(61,90,255,.3);border:0;background:var(--cobalt);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'],DS=['Du','Se','Ch','Pa','Ju','Sh'];
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const TIMES=['08:00','08:50','09:40','10:40','11:30','12:20','13:10'],PC=[4,5,5,5,6,6,7,7,7,7,7];
const TEACH=[['Karimova D.','Matematika'],['Yusupov A.','Adabiyot'],['Rahimova S.','Biologiya'],['Tursunov B.','Ingliz tili'],['Qodirov O.','Jismoniy tarbiya'],['Nazarova M.','Tarix'],['Aliyev R.','Fizika'],['Saidova N.','Kimyo'],['Ergashev T.','Informatika'],['Hasanova L.','Ona tili'],['Mirzayev J.','Geografiya'],['Ismoilova G.','Rus tili']];
const hue=s=>[...String(s||'')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),wdOf=i=>new Date(i+'T00:00').getDay();
const addDays=(i,n)=>{const d=new Date(i+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=i=>+i.slice(8)+'-'+MON[+i.slice(5,7)-1];
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3,5);

function genG(){const g=[];for(let d=0;d<6;d++){g[d]=[];for(let c=0;c<11;c++){g[d][c]=[];for(let p=0;p<7;p++){const t=TEACH[(c+d*3+p*5)%12];g[d][c][p]=p<PC[c]?[t[1],t[0],String(101+c)]:null}}}return g}
function mk(code,name,zav,email,pass,empty=false){const t=today();return{code,name,zav,email,pass,g:empty?Array.from({length:6},()=>Array.from({length:11},()=>Array(7).fill(null))):genG(),subs:[],notes:[],log:[],teachers:TEACH.map(x=>x[0]),
hol:[{n:'Kuzgi ta’til',a:'2026-11-04',b:'2026-11-10'},{n:'Qishki ta’til',a:'2026-12-28',b:'2027-01-10'},{n:'Bahorgi ta’til',a:'2027-03-21',b:'2027-03-27'},{n:'Yozgi ta’til',a:'2027-05-25',b:'2027-09-01'}],
off:[],ex:[{d:addDays(t,3),c:6,s:'Matematika',k:'Nazorat ishi'},{d:addDays(t,6),c:6,s:'Fizika',k:'Imtihon'},{d:addDays(t,5),c:9,s:'Ona tili',k:'Diktant'}]}}

const K='jadval_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.schools)S={pass:'admin',schools:[mk('M-01','32-maktab','Qosimov R.','test@darsjadvali.uz','darsjadvoli0751'),mk('M-02','1-maktab','Aliyeva N.','1-maktab@darsjadvali.uz','darsjadvoli0751',true),mk('M-45','45-maktab','Hamidova Z.','hamidova@m45.uz','4545')]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const V={role:'',in:false,sid:S.schools[0].code,cls:6,tn:'',tab:'',day:Math.max(0,wdOf(today())-1),demo:'',modal:null,err:'',show:'',pre:'',fromSuper:false};
const sch=()=>S.schools.find(x=>x.code===V.sid)||S.schools[0];
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)};
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');
const clsOpts=sel=>opts(Array.from({length:11},(_,i)=>[i,(i+1)+'-sinf']),sel);
const nextCode=()=>'M-'+String(Math.max(0,...S.schools.map(x=>+(/^M-(\d+)$/i.exec(x.code)||[0,0])[1]))+1).padStart(2,'0');
const genPass=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
const json=()=>JSON.stringify({schools:S.schools.map(({code,name,zav,email,pass})=>({code,name,zav,email,pass}))},null,2);

function holiday(s,d){const h=s.hol.find(h=>d>=h.a&&d<=h.b);return h?h.n:(s.off.includes(d)?'Kutilmagan ta’til (sovuq kun)':null)}
function resume(s,d){let x=addDays(d,1);for(let i=0;i<500;i++){if(wdOf(x)!==0&&!holiday(s,x))return x;x=addDays(x,1)}return x}
function plan(s,c,d){const h=holiday(s,d);if(h)return{off:h};const w=wdOf(d);if(w===0)return{off:'Yakshanba, dam olish kuni'};
const rows=[];s.g[w-1][c].forEach((x,p)=>{if(!x)return;const b=s.subs.find(z=>z.d===d&&z.c===c&&z.p===p);rows.push({p,s:(b&&b.s)||x[0],t:b?b.t:x[1],r:x[2],chg:!!b})});return{rows}}
function ttRows(s,n,d){const w=wdOf(d);if(w===0||holiday(s,d))return null;const r=[];for(let c=0;c<11;c++)for(let p=0;p<7;p++){const x=s.g[w-1][c][p],b=s.subs.find(z=>z.d===d&&z.c===c&&z.p===p),t=b?b.t:(x&&x[1]);
if((x||b)&&t===n)r.push({p,c,s:(b&&b.s)||x[0],r:x?x[2]:'',chg:!!b});else if(x&&x[1]===n&&b)r.push({p,c,s:x[0],r:x[2],gone:1})}return r.sort((a,b)=>a.p-b.p)}
function clashes(s,d){const out=[],bad=new Set();for(let p=0;p<7;p++){const tm={},rm={};for(let c=0;c<11;c++){const x=s.g[d][c][p];if(!x)continue;(tm[x[1]]=tm[x[1]]||[]).push(c);if(x[2])(rm[x[2]]=rm[x[2]]||[]).push(c)}
for(const[k,v]of Object.entries(tm))if(v.length>1){out.push(`${k}: ${p+1}-soat, ${v.map(i=>i+1).join(' va ')}-sinflarda bir vaqtda`);v.forEach(c=>bad.add(c+'-'+p))}
for(const[k,v]of Object.entries(rm))if(v.length>1){out.push(`${k}-xona: ${p+1}-soat, ${v.map(i=>i+1).join(' va ')}-sinflarga tushgan`);v.forEach(c=>bad.add(c+'-'+p))}}return{out,bad}}
const allClash=s=>[0,1,2,3,4,5].reduce((a,d)=>a+clashes(s,d).out.length,0);
const nowMin=()=>V.demo?toMin(V.demo):new Date().getHours()*60+new Date().getMinutes();

function lesson(r){const sub=r.c!=null?`${r.c+1}-sinf · <span class="mono">${esc(r.r)}</span>`:`${esc(r.t)} · <span class="mono">${esc(r.r)}</span>`;
return `<div class="lesson ${r.chg?'sub':''} ${r.gone?'gone':''}" style="--h:${hue(r.s)}"><span class="n">${r.p+1}</span><span><b>${esc(r.s)}</b><small>${sub}${r.chg?' · almashtirildi':''}${r.gone?' · boshqa ustoz kiradi':''}</small></span><span class="chip mono">${TIMES[r.p]}</span></div>`}
function nextBlk(rows){const m=nowMin(),nx=rows.find(r=>!r.gone&&toMin(TIMES[r.p])>m);if(!nx)return '<div class="next">Bugungi darslar tugagan</div>';const df=toMin(TIMES[nx.p])-m,room=nx.r?nx.r+'-xona':'kabinet';
return df<=5?`<div class="next ring">🔔 ${df} daqiqadan so‘ng: ${esc(nx.s)} — ${esc(room)}ga boring</div>`:`<div class="next">Keyingi dars: ${esc(nx.s)} · <span class="mono">${TIMES[nx.p]}</span> · ${esc(room)}</div>`}
function dayBody(s,rows,d,live){if(rows==null||rows.off){const o=rows&&rows.off||holiday(s,d)||'Yakshanba, dam olish kuni';return `<div class="banner">🗓 ${esc(o)}. Darslar ${fmt(resume(s,d))} da davom etadi.</div>`}
if(!rows.length)return '<div class="banner">Bu kuni dars yo‘q</div>';return (live?nextBlk(rows):'')+rows.map(lesson).join('')}
const noteList=a=>a.slice(0,5).map(n=>`<div class="nt">${esc(n.text)}<small>${new Date(n.ts).toLocaleString('uz-UZ')}</small></div>`).join('')||'<p class="note">Xabarlar yo‘q</p>';
const tabs=(a,cur,act)=>`<div class="tabs">${a.map(([k,l])=>`<button class="${k===cur?'on':''}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
const schoolSel=s=>`<label>Maktab<select data-c="sid">${opts(S.schools.map(x=>[x.code,x.name+' ('+x.code+')']),s.code)}</select></label>`;

function home(){return `<div class="hero"><small>Platformaga xush kelibsiz</small><h2>Maktab Dars Jadvali</h2><p style="margin:4px 0 0;font-size:.9rem;opacity:.9">O‘z rolingizni tanlang yoki maktabingiz jadvalini ko‘ring:</p></div>
<div class="cards">${[['student','🎒','O‘quvchi / ota-ona','Kunlik va haftalik dars jadvali, imtihonlar, ta’tillar'],['teacher','👩‍🏫','O‘qituvchi','Shaxsiy dars jadvali va xonalar taqsimoti'],['zav','🗂','Zavuch','Master jadval, to‘qnashuv, almashtirish, Excel'],['super','🛡','Bosh admin','Barcha maktablar ro‘yxati, yangi akkauntlar va parollar']].map(r=>`<button class="rc" data-a="role" data-v="${r[0]}"><span style="font-size:1.8rem">${r[1]}</span><b>${r[2]}</b><small>${r[3]}</small></button>`).join('')}</div>`}

function student(){const s=sch(),c=V.cls,t=V.tab||'bugun',T=today(),Tm=addDays(T,1);
let h=`<div class="sel">${schoolSel(s)}<label>Sinf<select data-c="cls">${clsOpts(c)}</select></label><label>Demo vaqt<input type="time" value="${V.demo}" data-c="demo"></label></div>`+tabs([['bugun','Bugun'],['ertaga','Ertaga'],['hafta','Hafta'],['imt','Imtihonlar'],['tatil','Ta’tillar']],t,'tab');
const notes=s.notes.filter(n=>n.c==='all'||n.c===c);
if(t==='bugun'||t==='ertaga'){const d=t==='bugun'?T:Tm;h+=`<div class="hero"><small>${DAYS[(wdOf(d)+6)%7]}, ${fmt(d)} · ${esc(s.name)}</small><h2>${t==='bugun'?'Bugun':'Ertaga'}, ${c+1}-sinf</h2></div>`+dayBody(s,plan(s,c,d),d,t==='bugun')+'<h3 class="disp" style="margin-top:18px">Xabarlar</h3>'+noteList(notes)}
if(t==='hafta')h+=`<div class="scroll"><table class="mx"><tr><th></th>${DS.map(x=>`<th>${x}</th>`).join('')}</tr>${TIMES.map((tm,p)=>`<tr><th>${p+1}-soat<br>${tm}</th>${DS.map((_,d)=>{const x=s.g[d][c][p];return x?`<td style="--h:${hue(x[0])}">${esc(x[0])}<small>${esc(x[1])} · ${esc(x[2])}</small></td>`:'<td class="e">—</td>'}).join('')}</tr>`).join('')}</table></div>`;
if(t==='imt'){const L=s.ex.filter(e=>e.c===c&&e.d>=T).sort((a,b)=>a.d<b.d?-1:1);h+=L.length?L.map(e=>`<div class="lesson" style="--h:${hue(e.s)}"><span class="n">📝</span><span><b>${esc(e.s)}</b><small>${esc(e.k)} · ${Math.round((new Date(e.d)-new Date(T))/864e5)} kun qoldi</small></span><span class="chip">${fmt(e.d)}</span></div>`).join(''):'<div class="banner">Yaqin imtihonlar yo‘q</div>'}
if(t==='tatil')h+=holList(s,false);return h}
